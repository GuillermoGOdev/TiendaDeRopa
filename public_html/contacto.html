    <meta charset="UTF-8">

<body>
    <header>
            <div class="nav-bar">
                <ul>
                    <li>
                        <a href="index.html">Inicio</a>

                        <a href="productos.html">Producto</a>

                        <a href="#">Contacto</a>
                    </li>
                </ul>
            </div>
        </header>

        <main>
            <h1>Contáctanos</h1>
            <div>
                <h3>Déjanos tu mensaje</h3>
                <form action="#">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre">
                    <br>

                    <label for="email">Correo:</label>
                    <input type="email" id="email" name="email">
                    <br>

                    <label for="asunto">Asunto:</label>
                    <select name="asunto" id="asunto">
                        <option value="Manejo de compras">Manejo de compras</option>
                        <option value="Devoluciones">Devoluciones</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <br>

                    <p>Método de contacto preferido:</p>
                    <input type="radio" id="m_email" name="metodo" value="Email">
                    <label for="m_email">Email</label>
                    <input type="radio" id="m_tel" name="metodo" value="Telefono">
                    <label for="m_tel">Telefono</label>

                    <input type="submit" value="Enviar">
                </form>
            </div>
        </main>

        <footer>
            <div>
                <p>© 2026 Fashion Style. Transformando la moda.</p>
            </div>
        </footer>
</body>
